
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعاء للمتوفى</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0b211d, #245447);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #c9aa65;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .moon {
            font-size: 45px;
            color: #e5c77b;
            margin-bottom: 15px;
        }

        h1 {
            color: #e5c77b;
            font-size: 30px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 21px;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .dua {
            font-size: 19px;
            line-height: 2.2;
            color: #f0f0f0;
            margin-bottom: 25px;
        }

        .amen {
            color: #e5c77b;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .footer {
            border-top: 1px solid #c9aa65;
            padding-top: 20px;
            color: #ddd;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="moon">☪</div>

        <h1>دعاء للمرحوم</h1>
        <h1> حسن دسوقي مخيمر </h1>

        <h2>اللهم ارحم فقيدنا الغالي</h2>

        <p class="dua">
            اللهم اغفر له وارحمه، وعافه واعف عنه،
            وأكرم نزله ووسّع مدخله،
            ونوّر قبره، وآنس وحشته،
            واجعل قبره روضةً من رياض الجنة،
            وأسكنه فسيح جناتك يا أرحم الراحمين.
        </p>

        <p class="amen">
            آمين يا رب العالمين 🤲
        </p>

        <div class="footer">
            لا تنسوه من صالح دعائكم
        </div>

    </div>

</body>
</html>
